<!DOCTYPE html>
<html lang="mn" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#fff8ed">
  <title>Erdenet Move — Хотын хэмнэлд хамтдаа</title>
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root{--ink:#19352f;--green:#2c7961;--orange:#ff9b55;--cream:#fff8ed;--yellow:#ffd66b}
    *{box-sizing:border-box} body{font-family:Nunito, sans-serif;color:var(--ink);background:#fffdf8}
    .hero{background:linear-gradient(135deg,#fff3d9 0%,#f8e9d8 48%,#dff1e6 100%);position:relative;overflow:hidden}
    .hero:before{content:"";position:absolute;inset:0;background-image:radial-gradient(#397c6517 1px,transparent 1px);background-size:22px 22px;pointer-events:none}
    .blob{position:absolute;border-radius:50%;filter:blur(1px);opacity:.45;animation:float 9s ease-in-out infinite}
    .blob.one{width:260px;height:260px;background:#ffd66b;top:70px;right:8%;animation-delay:-2s}
    .blob.two{width:180px;height:180px;background:#9dd9bd;bottom:20px;left:-45px;animation-delay:-5s}
    @keyframes float{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-22px) rotate(8deg)}}
    .city-scene{position:relative;height:300px;max-width:540px;margin:auto}
    .hill{position:absolute;bottom:0;width:115%;height:115px;left:-7%;background:#9bc9a6;border-radius:50% 50% 0 0}
    .hill.back{bottom:35px;background:#c0dfb6;height:100px;left:-2%;width:105%}
    .house{position:absolute;bottom:65px;width:90px;height:65px;background:#f5b66b;border:3px solid #fff8ed;border-radius:8px 8px 2px 2px;box-shadow:0 5px 0 #d58b55}
    .house:before{content:"";position:absolute;left:-10px;top:-28px;border-left:53px solid transparent;border-right:53px solid transparent;border-bottom:34px solid #c96e54}
    .house:after{content:"";position:absolute;bottom:0;left:34px;width:20px;height:34px;background:#8b6047;border-radius:8px 8px 0 0}
    .house.h1{left:7%;transform:scale(.85)}.house.h2{left:31%;bottom:82px;background:#e8c77b;transform:scale(.72)}.house.h3{right:8%;bottom:72px;background:#f0a27e;transform:scale(.92)}
    .sun{position:absolute;right:13%;top:14px;width:62px;height:62px;border-radius:50%;background:#ffd66b;box-shadow:0 0 0 12px #ffd66b33}
    .cloud{position:absolute;background:#fffdf4;border-radius:40px;width:80px;height:24px;top:55px;left:14%;animation:cloud 18s linear infinite}
    .cloud:before,.cloud:after{content:"";position:absolute;background:inherit;border-radius:50%}.cloud:before{width:34px;height:34px;left:13px;top:-17px}.cloud:after{width:27px;height:27px;right:12px;top:-12px}
    @keyframes cloud{0%{transform:translateX(-20px)}5
