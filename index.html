<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const SUPABASE_URL = "PASTE_YOUR_SUPABASE_PROJECT_URL_HERE";
    const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_PUBLISHABLE_OR_ANON_KEY_HERE";
    const SUPABASE_READY = SUPABASE_URL.startsWith("https://") && !SUPABASE_ANON_KEY.includes("PASTE_");
    const db = SUPABASE_READY ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;
    let currentUser = null;

    const routesData = [
     {id:"ch1",code:"Ч:1–2",name:"Их Залуу – Шанд",duration:25,interval:"10–15 мин",buses:["0216 ОРХ","7316 ОРО"],stops:["Их Залуу эцсийн буудал","Шанд 1-р буудал","Хүрэнбулаг","Үйлчилгээний төв / Төв","Баян-Өндөр цогцолбор"]},
     {id:"ch3",code:"Ч:3",name:"Баян Тал",duration:20,interval:"15 мин",buses:["8726 ОРО","8451 ОРО"],stops:["Баян Тал эцэс","Дэнж уулзвар","Оюутны гудамж","Хотын төв"]},
     {id:"ch4",code:"Ч:4",name:"Сагсай",duration:30,interval:"15–20 мин",buses:["4457 ОРА","4522 ОРА"],stops:["Сагсай эцэс","Цагаанчулуут","Баянцагаан","Төв буудал"]},
     {id:"ch5",code:"Ч:5",name:"Говил",duration:35,interval:"12–15 мин",buses:["8575 ОРН","8736 ОРО"],stops:["Говил эцэс","Говил сургууль","Автовокзал","Эрдэнэт үйлдвэр / Төв"]},
     {id:"ch6",code:"Ч:6",name:"Тосгон – Пирамид – Зээл",duration:20,interval:"10 мин",buses:["7386 ОРО","5365 ОРН"],stops:["Тосгон","Пирамид худалдааны төв","Их Зээл","4-р микро"]},
     {id:"ch7",code:"Ч:7",name:"Вокзал – Төгөл",duration:25,interval:"15 мин",buses:["7356 ОРО","1036 ОРО"],stops:["Төмөр замын вокзал","Төгөл их дэлгүүр","3-р микро","Сургуулийн бүс"]},
     {id:"ch8",code:"Ч:8",name:"Урд Хабитат – Дэнж – Даниста",duration:35,interval:"12 мин",buses:["6689 ОРА","8256 ОРО"],stops:["Урд Хабитат","Дэнж төв буудал","Уртын гол","Даниста","Хотын төв / Сургуулиуд"]},
     {id:"ch9",code:"Ч:9",name:"Яргуйт – Автовокзал",duration:30,interval:"15 мин",buses:["5911 ОРА","5578 ОРО"],stops:["Яргуйт эцэс","Яргуйт дунд буудал","Автовокзал","Үйлчилгээний төв"]}
    ];

    let selectedRouteId = "ch8", tasks = [], taxiGroups = [];
    const $ = id => document.getElementById(id);
    const safe = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

    function requireLogin() {
      if (!db) { alert("Эхлээд Supabase URL болон key оруулна уу."); return false; }
      if (!currentUser) { alert("Үйлдэл хийхийн тулд эхлээд имэйлээр нэвтэрнэ үү."); return false; }
      return true;
    }

    async function refreshCloudData() {
      if (!db || !currentUser) { 
        window.customTasks = []; 
        // Анхдагч цэвэрхэн demo группүүд
        taxiGroups = [
          {id: "demo1", route: "Дэнж → 1-р сургууль", time: "07:15", price: 1000, members: 3},
          {id: "demo2", route: "Говил → Төв сургууль", time: "07:20", price: 1200, members: 2}
        ]; 
        renderTaxi(); generateSchedule(); return; 
      }
      const [taskRes, groupRes] = await Promise.all([
        db.from("planner_tasks").select("id,task_time,title").order("task_time"),
        db.from("taxi_groups").select("id,route_text,departure_time,price_per_person,member_count").order("created_at",{ascending:false})
      ]);
      if (!taskRes.error) window.customTasks = (taskRes.data || []).map(t => ({id: t.id, time: t.task_time, title: t.title, fixed: false}));
      if (!groupRes.error) taxiGroups = (groupRes.data || []).map(g => ({id: g.id, route: g.route_text, time: g.departure_time, price: g.price_per_person, members: g.member_count}));
      renderTaxi(); generateSchedule();
    }

    function renderRoutes() {
      const grid = $("routesGrid"), select = $("calcRoute");
      grid.innerHTML = ""; select.innerHTML = "";
      routesData.forEach(r => {
        const card = document.createElement("button");
        card.type = "button";
        card.className = "claude-card p-5 text-left flex flex-col justify-between hover:border-slate-400 transition";
        card.innerHTML = `<div><div class="flex justify-between"><span class="bg-slate-100 text-slate-800 px-2.5 py-1 rounded-md text-xs font-black">${safe(r.code)}</span><span class="text-xs text-amber-600 font-bold">↗</span></div><h3 class="font-black text-base text-slate-900 mt-3">${safe(r.name)}</h3><p class="text-xs text-slate-500 font-semibold mt-1">⏱ ${r.duration} мин</p></div><div class="text-xs font-black text-amber-600 mt-4">Буудал харах →</div>`;
        card.addEventListener("click", () => openRoute(r.id));
        grid.appendChild(card);
        const opt = document.createElement("option");
        opt.value = r.id; opt.textContent = `${r.code} — ${r.name}`;
        if (r.id === "ch8") opt.selected = true;
        select.appendChild(opt);
      });
    }

    function openRoute(id) {
      const r = routesData.find(x => x.id === id); if (!r) return;
      selectedRouteId = id;
      $("modalTitle").textContent = `${r.code} — ${r.name}`;
      $("modalDesc").textContent = `Дундаж хугацаа: ${r.duration} минут • Интервал: ${r.interval}`;
      $("modalBuses").innerHTML = r.buses.map(b => `<span class="bg-slate-100 rounded-md px-2.5 py-1 text-xs font-bold text-slate-800">${safe(b)}</span>`).join("");
      $("modalStops").innerHTML = r.stops.map((s, i) => `<div class="flex items-center gap-2 text-xs font-bold text-slate-700"><span class="w-5 h-5 rounded-full bg-slate-900 text-white grid place-items-center">${i+1}</span>${safe(s)}</div>`).join("");
      $("routeModal").classList.add("show");
    }

    function closeModal() { $("routeModal").classList.remove("show"); }
    function parseTime(v) { const [h, m] = v.split(":").map(Number); return h * 60 + m; }
    function fmt(n) { n = (n % 1440 + 1440) % 1440; return String(Math.floor(n / 60)).padStart(2,"0") + ":" + String(n % 60).padStart(2,"0"); }

    function generateSchedule() {
      const route = routesData.find(r => r.id === $("calcRoute").value) || routesData[6];
      const start = parseTime($("calcStartTime").value || "08:00"), end = parseTime($("calcEndTime").value || "13:30");
      const walk = Math.max(1, Math.min(60, Number($("calcWalk").value) || 10)), buffer = Number($("calcWeather").value) || 0;
      const arrive = start - 10, board = arrive - route.duration - buffer, leave = board - walk, wake = leave - 35;

      $("bigDepartureTime").textContent = fmt(leave);
      $("bigAdviceText").textContent = `${route.code} чиглэлээр тооцов. Хичээлээс 10 минутын өмнө очино.`;

      tasks = [
        {time: fmt(wake), title: "Өглөө сэрэх, бэлтгэх", desc: "Хэрэгслээ шалгах", fixed: true},
        {time: fmt(leave), title: "🚪 Гэрээсээ гарах", desc: `${route.stops[0]} руу ${walk} мин алхана`, fixed: true},
        {time: fmt(board), title: `🚌 ${route.code} автобусанд суух`, desc: `${route.name}`, fixed: true},
        {time: fmt(arrive), title: "🏫 Сургууль дээр ирэх", desc: "Хичээл эхлэхээс 10 мин өмнө", fixed: true},
        {time: fmt(start), title: "📚 Хичээл эхлэх", desc: "Үндсэн хичээлүүд", fixed: true},
        {time: fmt(end), title: "🔔 Хичээл тарах", desc: "Буцах замын мэдээлэл шалгах", fixed: true}
      ];
      const custom = window.customTasks || [];
      tasks.push(...custom);
      renderTasks();
    }

    window.customTasks = [];
    function renderTasks() {
      tasks.sort((a, b) => parseTime(a.time) - parseTime(b.time));
      $("taskCount").textContent = `${tasks.length} ажил`;
      $("timelineContainer").innerHTML = tasks.map((t) => `
        <div class="flex items-center justify-between p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs">
          <div class="flex items-center gap-3">
            <span class="font-black text-amber-600">${safe(t.time)}</span>
            <div>
              <div class="font-bold text-slate-900">${safe(t.title)}</div>
              <div class="text-slate-500 text-[11px]">${safe(t.desc || "Хувийн ажил")}</div>
            </div>
          </div>
          ${t.fixed ? '<span class="text-[10px] text-slate-400 font-bold">Үндсэн</span>' : `<button onclick="deleteTask('${t.id}')" class="text-rose-600 font-bold">Устгах</button>`}
        </div>
      `).join("");
    }

    async function addTask() {
      const time = $("customTime").value, title = $("customTitle").value.trim();
      if (!time || !title) { alert("Цаг болон ажлын нэрээ оруулна уу."); return; }
      if (!requireLogin()) return;
      const { data, error } = await db.from("planner_tasks").insert({user_id: currentUser.id, task_time: time, title}).select("id,task_time,title").single();
      if (error) { alert(error.message); return; }
      window.customTasks.push({id: data.id, time: data.task_time, title: data.title});
      $("customTitle").value = ""; generateSchedule();
    }

    async function deleteTask(id) {
      if (!requireLogin()) return;
      await db.from("planner_tasks").delete().eq("id", id);
      window.customTasks = window.customTasks.filter(x => x.id !== id);
      generateSchedule();
    }

    function renderTaxi() {
      $("taxiGroups").innerHTML = taxiGroups.length ? taxiGroups.map(g => `
        <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl text-xs space-y-2">
          <div class="flex justify-between font-bold text-slate-900"><span>${safe(g.route)}</span><span class="text-amber-600">${g.members}/4 хүн</span></div>
          <div class="text-slate-500">🕒 ${safe(g.time)} • ${Number(g.price||0).toLocaleString()}₮</div>
          <button onclick="joinTaxi('${g.id}')" class="btn-outline w-full !py-1 text-xs">Нэгдэх</button>
        </div>
      `).join("") : '<div class="text-xs text-slate-500 text-center py-4">Одоогоор групп алга байна.</div>';
    }

    async function createTaxi() {
      if (!requireLogin()) return;
      const route = $("taxiRoute").value.trim(), time = $("taxiTime").value, price = Number($("taxiPrice").value);
      if (!route || !time) { alert("Мэдээллээ бүрэн оруулна уу."); return; }
      const { error } = await db.rpc("create_taxi_group", {p_route_text: route, p_departure_time: time, p_price_per_person: price});
      if (error) { alert(error.message); return; }
      $("taxiRoute").value = ""; $("taxiPrice").value = ""; await refreshCloudData();
    }

    async function joinTaxi(id) {
      if (!requireLogin()) return;
      const { error } = await db.rpc("join_taxi_group", {p_group_id: id});
      if (error) { alert(error.message); return; }
      await refreshCloudData(); alert("Амжилттай нэгдлээ!");
    }

    async function initAuth() {
      if (!db) {
        taxiGroups = [
          {id: "demo1", route: "Дэнж → 1-р сургууль", time: "07:15", price: 1000, members: 3},
          {id: "demo2", route: "Говил → Төв сургууль", time: "07:20", price: 1200, members: 2}
        ];
        renderTaxi(); generateSchedule(); return;
      }
      const { data } = await db.auth.getSession(); currentUser = data.session?.user || null; updateAuthUI();
      db.auth.onAuthStateChange((_, session) => { currentUser = session?.user || null; updateAuthUI(); refreshCloudData(); });
      $("signInBtn").onclick = async () => { await db.auth.signInWithPassword({email: $("authEmail").value, password: $("authPassword").value}); };
      $("signUpBtn").onclick = async () => { await db.auth.signUp({email: $("authEmail").value, password: $("authPassword").value}); alert("Бүртгэл үүслээ."); };
      $("signOutBtn").onclick = async () => { await db.auth.signOut(); };
      await refreshCloudData();
    }

    function updateAuthUI() {
      $("signInBtn").classList.toggle("hidden", !!currentUser);
      $("signUpBtn").classList.toggle("hidden", !!currentUser);
      $("signOutBtn").classList.toggle("hidden", !currentUser);
      $("authStatus").textContent = currentUser ? `Нэвтэрсэн: ${currentUser.email}` : "Имэйлээр нэвтэрнэ үү.";
    }

    $("generateBtn").onclick = generateSchedule;
    $("addTaskBtn").onclick = addTask;
    $("createTaxiBtn").onclick = createTaxi;
    $("closeModalBtn").onclick = closeModal;
    $("useRouteBtn").onclick = () => { $("calcRoute").value = selectedRouteId; closeModal(); generateSchedule(); $("planner").scrollIntoView({behavior: "smooth"}); };

    renderRoutes(); renderTaxi(); generateSchedule(); initAuth();
  </script>
