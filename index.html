<!-- APPLICATION LOGIC -->
  <script>
    // ==========================================
    // 1. STATE & DATA MODELS (ERDENET CONTEXT)
    // ==========================================
    let currentLang = 'en';
    let currentRole = 'parent'; // 'parent' | 'kid'
    let activeRouteFilter = 'ALL';
    let selectedStopId = 'STOP-1R';

    // Start empty or load from localStorage so it doesn't show hardcoded mock demo data on fresh load
    let plannerTasks = JSON.parse(localStorage.getItem('genesis_planner_tasks')) || [];

    const i18n = {
      en: {
        tagline: "Family Transit & Daily Sync",
        parentView: "Parent View",
        kidView: "Kid Mode",
        heroPill: "2 Kids Active • Live Erdenet Transit Synced",
        heroTitle1: "Smart Family Sync &",
        heroTitle2: "Erdenet Live Transit",
        heroDesc: "From traditional Ger districts on Bayan-Öndör hills to central avenues—track which exact bus your kids board, view live arrival times, and coordinate daily family schedules in real time.",
        btnLiveMap: "Live Bus Map",
        btnPlanner: "Daily Family Planner",
        parentRadarTag: "FAMILY TELEMETRY // ACTIVE",
        kidsLiveTitle: "Children Live Status & Bus Boarding",
        requestLocation: "Ping GPS Check-in",
        kidWelcome: "Сайн уу, Тэмүүлэн! (Hi, Temuulen!)",
        kidSub: "Tap when you board a bus or arrive at school so Mom & Dad know you're safe.",
        btnTapBus: "Tap Bus Card (Boarded)",
        btnImSafe: "I'm Safe at Stop",
        selectBusLabel: "Select Current Bus:",
        transitTitle: "Erdenet City Live Bus Map & Arrivals",
        mapHint: "Click any stop or bus for live ETA",
        selectedStopLabel: "SELECTED BUS STOP",
        childAboardHighlight: "Highlighted badge shows which bus your child is aboard",
        plannerTitle: "Today's Routine & Transit Plan",
        completionLabel: "Daily Completion",
        activityTitle: "Live Alerts & Check-ins"
      },
      mn: {
        tagline: "Гэр бүлийн төлөвлөгч ба Автобус хяналт",
        parentView: "Эцэг эх",
        kidView: "Хүүхэд",
        heroPill: "2 Хүүхэд Идэвхтэй • Эрдэнэт Автобус Шууд Холбогдсон",
        heroTitle1: "Ухаалаг Гэр Бүл &",
        heroTitle2: "Эрдэнэт Шууд Тээвэр",
        heroDesc: "Баян-Өндөрийн гэр хорооллоос хотын төв өргөн чөлөө хүртэл — хүүхдүүд тань ямар чиглэлийн автобусанд суусныг шууд харж, өдрийн хуваариа хамтдаа төлөвлөөрэй.",
        btnLiveMap: "Автобусны Шууд Зураг",
        btnPlanner: "Өдрийн Төлөвлөгч",
        parentRadarTag: "ГЭР БҮЛИЙН БАЙРШИЛ // ИДЭВХТЭЙ",
        kidsLiveTitle: "Хүүхдүүдийн Байршил ба Суусан Автобус",
        requestLocation: "Байршил Шинэчлэх",
        kidWelcome: "Сайн уу, Тэмүүлэн!",
        kidSub: "Автобусанд суухдаа эсвэл буудал дээр очоод картаа уншуулж аав ээждээ мэдэгдээрэй.",
        btnTapBus: "Карт Уншуулах",
        btnImSafe: "Би Аюулгүй Байна",
        selectBusLabel: "Автобус сонгох:",
        transitTitle: "Эрдэнэт Хотын Автобусны Шууд Зуглал",
        mapHint: "Цагийн хуваарь харахын тулд буудал эсвэл автобус дээр дарна уу",
        selectedStopLabel: "СОНГОСОН БУУДԱЛ",
        childAboardHighlight: "Тодруулсан шошго нь таны хүүхдийн яваа автобусыг заана",
        plannerTitle: "Өдрийн Хуваарь ба Тээврийн Төлөвлөгөө",
        completionLabel: "Гүйцэтгэл",
        activityTitle: "Шууд Мэдэгдэл ба Битүүмжлэл"
      }
    };

    let kidsData = [
      { id: 'kid-1', name: 'Тэмүүлэн (Temuulen)', age: 15, school: 'Biligt-Urgoo High School', status: 'On Bus Ч:2 (Heading to 5-р Микро)', bus: 'Ч:2', time: '16:38', battery: '92%', avatar: '👨‍🎓', safe: true },
      { id: 'kid-2', name: 'Анужин (Anujin)', age: 10, school: 'Erdenet Primary #3', status: 'Arrived at School Safe', bus: 'Ч:1', time: '16:15', battery: '85%', avatar: '👧', safe: true }
    ];

    let stopsData = [
      { id: 'STOP-1R', name: '1-р хороолол (1st Microdistrict)', code: 'STOP #04', route: 'Ч:1', arrivals: [ { bus: 'Ч:1 Green', eta: '2 min', plate: '11-45 ОРХ' }, { bus: 'Ч:4 Blue', eta: '7 min', plate: '52-10 ОРХ' } ] },
      { id: 'STOP-5M', name: '5-р Микро орон сууц (5th Microdistrict)', code: 'STOP #12', route: 'Ч:2', arrivals: [ { bus: 'Ч:2 Silver', eta: '1 min', plate: '04-82 ОРХ', kidAboard: true }, { bus: 'Ч:3 Purple', eta: '9 min', plate: '88-19 ОРХ' } ] },
      { id: 'STOP-SQ', name: 'Төв Талбай (Central Square)', code: 'STOP #01', route: 'Ч:3', arrivals: [ { bus: 'Ч:3 Purple', eta: '4 min', plate: '88-19 ОРХ' }, { bus: 'Ч:2 Silver', eta: '12 min', plate: '04-82 ОРХ' } ] },
      { id: 'STOP-BYN', name: 'Баян-Өндөр Гэр Хороолол (Bayan-Öndör)', code: 'STOP #19', route: 'Ч:4', arrivals: [ { bus: 'Ч:4 Blue', eta: '5 min', plate: '52-10 ОРХ' } ] }
    ];

    let activityLog = [
      { time: '16:38', text: 'Temuulen boarded Bus Ч:2 (04-82 ОРХ) towards 5-р Микро', type: 'bus' },
      { time: '16:15', text: 'Anujin check-in confirmed at Erdenet Primary #3', type: 'safe' },
      { time: '15:50', text: 'System synced live GPS telemetry for Orkhon Region', type: 'system' }
    ];

    // Initialize UI on load
    window.addEventListener('DOMContentLoaded', () => {
      startClock();
      renderKidsDashboard();
      renderTransitMap();
      renderStopSelectors();
      renderLiveArrivals();
      renderPlannerTasks();
      renderActivityFeed();
    });

    function startClock() {
      setInterval(() => {
        const now = new Date();
        document.getElementById('live-clock').innerText = now.toTimeString().split(' ')[0];
      }, 1000);
    }

    function toggleLang() {
      currentLang = currentLang === 'en' ? 'mn' : 'en';
      const dict = i18n[currentLang];
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (dict[key]) el.innerText = dict[key];
      });
    }

    function setRole(role) {
      currentRole = role;
      const pBtn = document.getElementById('btn-role-parent');
      const kBtn = document.getElementById('btn-role-kid');
      const pPanel = document.getElementById('parent-dashboard-panel');
      const kPanel = document.getElementById('kid-dashboard-panel');

      if (role === 'parent') {
        pBtn.className = "px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all bg-lime text-void shadow-sm flex items-center gap-1.5";
        kBtn.className = "px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all text-zinc-400 hover:text-white flex items-center gap-1.5";
        pPanel.classList.remove('hidden');
        kPanel.classList.add('hidden');
      } else {
        kBtn.className = "px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all bg-indigo text-white shadow-sm flex items-center gap-1.5";
        pBtn.className = "px-3 sm:px-4 py-1.5 rounded-full text-xs sm:text-sm font-semibold transition-all text-zinc-400 hover:text-white flex items-center gap-1.5";
        kPanel.classList.remove('hidden');
        pPanel.classList.add('hidden');
      }
    }

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      toast.className = `p-4 rounded-xl border pointer-events-auto shadow-xl flex items-center gap-3 transition transform translate-y-2 opacity-0 ${
        type === 'success' ? 'bg-surface border-lime/40 text-white' : 'bg-surface border-rose-500/40 text-white'
      }`;
      toast.innerHTML = `
        <span class="w-2.5 h-2.5 rounded-full ${type === 'success' ? 'bg-lime' : 'bg-rose-500'} animate-pulse"></span>
        <div class="text-xs font-semibold">${message}</div>
      `;
      container.appendChild(toast);
      setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
      setTimeout(() => {
        toast.classList.add('translate-y-2', 'opacity-0');
        setTimeout(() => toast.remove(), 300);
      }, 3500);
    }

    // Render Parent Kids Cards
    function renderKidsDashboard() {
      const container = document.getElementById('kids-cards-container');
      container.innerHTML = kidsData.map(kid => `
        <div class="rounded-2xl bg-surface border border-zinc-800 p-5 space-y-4 brutal-shadow">
          <div class="flex items-start justify-between">
            <div class="flex items-center gap-3">
              <div class="w-12 h-12 rounded-2xl bg-zinc-900 border border-zinc-700 flex items-center justify-center text-2xl">
                ${kid.avatar}
              </div>
              <div>
                <h3 class="font-display font-bold text-white text-base">${kid.name}</h3>
                <p class="text-xs text-zinc-400">${kid.school}</p>
              </div>
            </div>
            <span class="px-2.5 py-1 rounded-full bg-lime/10 text-lime border border-lime/30 text-[11px] font-mono font-bold">
              GPS ONLINE
            </span>
          </div>

          <div class="bg-zinc-900/80 rounded-xl p-3.5 border border-zinc-800/80 space-y-2">
            <div class="flex items-center justify-between text-xs">
              <span class="text-zinc-400">Current Status:</span>
              <span class="font-bold text-lime">${kid.status}</span>
            </div>
            <div class="flex items-center justify-between text-xs">
              <span class="text-zinc-400">Last Ping:</span>
              <span class="font-mono text-zinc-300">${kid.time} (Battery: ${kid.battery})</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // Kid Quick Actions
    function kidBoardBusAction() {
      const select = document.getElementById('kid-bus-select');
      const busVal = select.value;
      const statusText = `On Bus ${busVal} (Erdenet Transit Grid)`;
      kidsData[0].status = statusText;
      kidsData[0].time = new Date().toTimeString().split(' ')[0].substring(0,5);
      document.getElementById('kid-current-status-text').innerText = statusText;
      
      activityLog.unshift({
        time: kidsData[0].time,
        text: `Temuulen tapped card & boarded ${busVal}`,
        type: 'bus'
      });
      renderKidsDashboard();
      renderActivityFeed();
      showToast(`Success! Boarding signal sent for ${busVal}`);
    }

    function kidSafePingAction() {
      kidsData[0].status = 'Arrived Safely at Stop / School';
      kidsData[0].time = new Date().toTimeString().split(' ')[0].substring(0,5);
      document.getElementById('kid-current-status-text').innerText = kidsData[0].status;
      
      activityLog.unshift({
        time: kidsData[0].time,
        text: `Temuulen checked in as Safe`,
        type: 'safe'
      });
      renderKidsDashboard();
      renderActivityFeed();
      showToast(`Safe check-in sent to parents!`);
    }

    function kidSosAction() {
      showToast(`SOS Emergency alert dispatched to Family & Erdenet Dispatch!`, 'error');
      activityLog.unshift({
        time: new Date().toTimeString().split(' ')[0].substring(0,5),
        text: `SOS EMERGENCY triggered by Temuulen`,
        type: 'error'
      });
      renderActivityFeed();
    }

    function simulateKidPing() {
      showToast(`GPS Ping requested. Location updated successfully.`);
      renderKidsDashboard();
    }

    // Planner Functions with localStorage
    function renderPlannerTasks() {
      const container = document.getElementById('planner-tasks-list');
      
      if (plannerTasks.length === 0) {
        container.innerHTML = `
          <div class="p-8 text-center bg-zinc-900/40 rounded-xl border border-dashed border-zinc-800">
            <p class="text-sm text-zinc-400">No family schedule items yet.</p>
            <p class="text-xs text-zinc-500 mt-1">Use the form above to add your first bus ride or class task!</p>
          </div>
        `;
        document.getElementById('planner-progress-text').innerText = `0 / 0 Done (0%)`;
        document.getElementById('planner-percent-badge').innerText = `0%`;
        return;
      }

      container.innerHTML = plannerTasks.map((t, idx) => `
        <div class="flex items-center justify-between p-3.5 rounded-xl bg-zinc-900/60 border ${t.done ? 'border-lime/30 bg-lime/5' : 'border-zinc-800'} transition">
          <div class="flex items-center gap-3">
            <input type="checkbox" ${t.done ? 'checked' : ''} onchange="toggleTask(${idx})" class="w-4 h-4 rounded border-zinc-700 text-lime focus:ring-lime bg-void cursor-pointer" />
            <div>
              <div class="text-sm font-semibold ${t.done ? 'line-through text-zinc-500' : 'text-white'}">${t.title}</div>
              <div class="text-[11px] text-zinc-400 flex items-center gap-2 mt-0.5">
                <span class="font-mono text-lime">🕒 ${t.time}</span>
                <span>•</span>
                <span>👤 ${t.kid}</span>
                <span>•</span>
                <span class="px-1.5 py-0.5 rounded bg-zinc-800 text-[10px]">${t.bus}</span>
              </div>
            </div>
          </div>
          <button onclick="deleteTask(${idx})" class="text-zinc-500 hover:text-rose-400 p-1 text-xs">✕</button>
        </div>
      `).join('');

      const doneCount = plannerTasks.filter(t => t.done).length;
      const total = plannerTasks.length;
      const pct = total > 0 ? Math.round((doneCount / total) * 100) : 0;
      document.getElementById('planner-progress-text').innerText = `${doneCount} / ${total} Done (${pct}%)`;
      document.getElementById('planner-percent-badge').innerText = `${pct}%`;
      
      localStorage.setItem('genesis_planner_tasks', JSON.stringify(plannerTasks));
    }

    function handleAddTask(e) {
      e.preventDefault();
      const title = document.getElementById('task-title-input').value;
      const time = document.getElementById('task-time-input').value;
      const kid = document.getElementById('task-kid-input').value;
      const bus = document.getElementById('task-bus-input').value;

      plannerTasks.push({ title, time, kid, bus, done: false });
      document.getElementById('task-title-input').value = '';
      renderPlannerTasks();
      showToast('Task added to family planner!');
    }

    function toggleTask(idx) {
      plannerTasks[idx].done = !plannerTasks[idx].done;
      renderPlannerTasks();
    }

    function deleteTask(idx) {
      plannerTasks.splice(idx, 1);
      renderPlannerTasks();
      showToast('Task removed.');
    }

    // Transit Map & Arrivals
    function filterRoute(route) {
      activeRouteFilter = route;
      document.querySelectorAll('.route-pill').forEach(btn => {
        if(btn.getAttribute('data-route') === route) {
          btn.className = "route-pill px-3.5 py-1.5 rounded-full text-xs font-bold bg-lime text-void transition";
        } else {
          btn.className = "route-pill px-3.5 py-1.5 rounded-full text-xs font-semibold bg-zinc-900 text-zinc-300 border border-zinc-700 hover:border-zinc-500 transition";
        }
      });
      renderTransitMap();
    }

    function renderTransitMap() {
      // SVG Map Stops
      const stopsLayer = document.getElementById('map-stops-layer');
      const stopsCoords = [
        { id: 'STOP-1R', x: 230, y: 300, name: '1-р хороолол', route: 'Ч:1' },
        { id: 'STOP-5M', x: 570, y: 310, name: '5-р Микро', route: 'Ч:2' },
        { id: 'STOP-SQ', x: 410, y: 285, name: 'Төв Талбай', route: 'Ч:3' },
        { id: 'STOP-BYN', x: 460, y: 115, name: 'Баян-Өндөр', route: 'Ч:4' }
      ];

      stopsLayer.innerHTML = stopsCoords.map(s => `
        <g class="cursor-pointer" onclick="selectStop('${s.id}')">
          <circle cx="${s.x}" cy="${s.y}" r="8" fill="${selectedStopId === s.id ? '#A3E635' : '#18181D'}" stroke="#A3E635" stroke-width="3" />
          <text x="${s.x}" y="${s.y - 14}" text-anchor="middle" fill="#E4E4E7" font-size="10" font-family="Space Grotesk" font-weight="600">${s.name}</text>
        </g>
      `).join('');

      // SVG Active Buses
      const busesLayer = document.getElementById('map-buses-layer');
      const buses = [
        { id: 'BUS-204', x: 490, y: 295, route: 'Ч:2', color: '#A3E635', kidAboard: true },
        { id: 'BUS-101', x: 150, y: 305, route: 'Ч:1', color: '#10B981', kidAboard: false },
        { id: 'BUS-309', x: 420, y: 200, route: 'Ч:3', color: '#8B5CF6', kidAboard: false },
        { id: 'BUS-402', x: 300, y: 350, route: 'Ч:4', color: '#38BDF8', kidAboard: false }
      ];

      busesLayer.innerHTML = buses
        .filter(b => activeRouteFilter === 'ALL' || b.route === activeRouteFilter)
        .map(b => `
          <g transform="translate(${b.x}, ${b.y})" class="cursor-pointer">
            <rect x="-14" y="-10" width="28" height="20" rx="4" fill="${b.color}" stroke="#09090B" stroke-width="2" />
            <text x="0" y="3" text-anchor="middle" fill="#09090B" font-size="9" font-weight="900">${b.route}</text>
            ${b.kidAboard ? '<circle cx="0" cy="-16" r="4" fill="#60A5FA" class="animate-ping"/>' : ''}
          </g>
        `).join('');

      // SVG Kids GPS Pins
      const kidsLayer = document.getElementById('map-kids-layer');
      kidsLayer.innerHTML = `
        <g transform="translate(510, 298)">
          <circle cx="0" cy="0" r="10" fill="#8B5CF6" opacity="0.3" class="pulse-ring" />
          <circle cx="0" cy="0" r="5" fill="#8B5CF6" stroke="#FFFFFF" stroke-width="1.5" />
          <text x="12" y="3" fill="#C4B5FD" font-size="10" font-weight="bold">Тэмүүлэн (Bus Ч:2)</text>
        </g>
      `;
    }

    function renderStopSelectors() {
      const container = document.getElementById('stop-selector-pills');
      container.innerHTML = stopsData.map(s => `
        <button onclick="selectStop('${s.id}')" class="px-3 py-1 rounded-lg text-xs font-semibold whitespace-nowrap transition ${
          selectedStopId === s.id ? 'bg-lime text-void font-bold' : 'bg-zinc-900 text-zinc-300 hover:bg-zinc-800 border border-zinc-800'
        }">
          ${s.name.split(' ')[0]}
        </button>
      `).join('');
    }

    function selectStop(id) {
      selectedStopId = id;
      renderStopSelectors();
      renderLiveArrivals();
      renderTransitMap();
    }

    function renderLiveArrivals() {
      const stop = stopsData.find(s => s.id === selectedStopId) || stopsData[0];
      document.getElementById('selected-stop-name').innerHTML = `<span>${stop.name}</span>`;
      document.getElementById('selected-stop-code').innerText = stop.code;

      const container = document.getElementById('live-arrivals-list');
      container.innerHTML = stop.arrivals.map(a => `
        <div class="p-3.5 rounded-xl bg-zinc-900/60 border border-zinc-800 flex items-center justify-between">
          <div class="flex items-center gap-3">
            <div class="w-9 h-9 rounded-lg bg-zinc-800 flex items-center justify-center font-bold text-xs text-lime">
              BUS
            </div>
            <div>
              <div class="text-sm font-bold text-white flex items-center gap-2">
                <span>${a.bus}</span>
                ${a.kidAboard ? '<span class="px-2 py-0.5 rounded-full bg-indigo/20 text-indigo text-[10px] font-bold border border-indigo/40">Kid Aboard</span>' : ''}
              </div>
              <div class="text-[11px] text-zinc-400 font-mono">Plate: ${a.plate}</div>
            </div>
          </div>
          <div class="text-right">
            <div class="text-sm font-extrabold text-lime font-mono">${a.eta}</div>
            <div class="text-[10px] text-zinc-500 uppercase">Live ETA</div>
          </div>
        </div>
      `).join('');
    }

    function renderActivityFeed() {
      const container = document.getElementById('activity-feed-list');
      container.innerHTML = activityLog.map(item => `
        <div class="p-3 rounded-xl bg-zinc-900/50 border border-zinc-800/80 text-xs space-y-1">
          <div class="flex items-center justify-between text-[10px] text-zinc-400 font-mono">
            <span class="text-lime">${item.time}</span>
            <span class="uppercase">${item.type}</span>
          </div>
          <div class="text-zinc-200">${item.text}</div>
        </div>
      `).join('');
    }

    function clearActivityLog() {
      activityLog = [];
      renderActivityFeed();
      showToast('Activity log cleared.');
    }
  </script>
</body>
</html>
