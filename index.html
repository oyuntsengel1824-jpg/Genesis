<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Erdenet Transit & Student Planner — Ухаалаг Сурагч Тээвэр</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Animated City & Ger District Background Theme */
        .hero-bg {
            background-color: #0b1329;
            background-image: 
                radial-gradient(at 10% 20%, rgba(30, 58, 138, 0.4) 0px, transparent 50%),
                radial-gradient(at 90% 30%, rgba(13, 148, 136, 0.3) 0px, transparent 50%),
                radial-gradient(at 50% 90%, rgba(99, 102, 241, 0.25) 0px, transparent 50%);
            position: relative;
            overflow: hidden;
        }

        /* Subtle moving background animation representing city life & ger districts */
        .hero-bg::before {
            content: "";
            position: absolute;
            inset: 0;
            background-image: url('https://images.unsplash.com/photo-1517732306149-e8f829eb588a?q=80&w=1920&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            opacity: 0.12;
            mix-blend-mode: luminosity;
            animation: pulseGlow 15s ease-in-out infinite alternate;
        }

        @keyframes pulseGlow {
            0% { transform: scale(1); opacity: 0.1; }
            100% { transform: scale(1.05); opacity: 0.18; }
        }

        .glass-card {
            background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
    </style>
</head>
